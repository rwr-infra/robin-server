[package]
name = "rwrs-server"
version = "0.5.0"
edition = "2024"

[lib]
name = "rwrs_server"
path = "src/lib.rs"

[[bin]]
name = "rwrs-server"
path = "src/main.rs"

[dependencies]
salvo = { version = "0.89.3", features = ["request-id", "logging", "serve-static", "affix-state"] }
tokio = { version = "1.48.0", features = ["macros", "sync", "time"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.29"
roxmltree = "0.21"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.14"
